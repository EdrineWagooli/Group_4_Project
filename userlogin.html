<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Sign In — AgriRoute</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;0,900;1,700&family=Libre+Baskerville:ital@0;1&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet"/>
<style>
  :root {
    --green-deep:   #1a3a2a;
    --green-mid:    #2d6a4f;
    --green-light:  #52b788;
    --gold:         #c9a84c;
    --gold-light:   #e6c97a;
    --cream:        #f5f0e8;
    --white:        #ffffff;
    --text-dark:    #0f1f17;
    --border:       rgba(255,255,255,0.10);
    --input-bg:     rgba(255,255,255,0.05);
    --input-border: rgba(255,255,255,0.15);
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'DM Sans', sans-serif;
    min-height: 100vh;
    background: var(--green-deep);
    display: flex;
    align-items: stretch;
    overflow-x: hidden;
  }

  /* ── LEFT PANEL (image side) ── */
  .panel-left {
    flex: 1;
    position: relative;
    display: flex;
    flex-direction: column;
    justify-content: flex-end;
    padding: 3rem;
    min-height: 100vh;
    overflow: hidden;
  }
  .panel-left-bg {
    position: absolute;
    inset: 0;
    background: url('pineapple.jpg') center 30% / cover no-repeat;
    filter: brightness(0.65) saturate(1.1);
    z-index: 0;
  }
  .panel-left-overlay {
    position: absolute;
    inset: 0;
    background: linear-gradient(
      160deg,
      rgba(10,25,16,0.30) 0%,
      rgba(10,25,16,0.75) 70%,
      rgba(10,25,16,0.92) 100%
    );
    z-index: 1;
  }
  .panel-left-content {
    position: relative;
    z-index: 2;
  }
  .panel-logo {
    position: absolute;
    top: 2.5rem; left: 3rem;
    z-index: 2;
    font-family: 'Playfair Display', serif;
    font-size: 1.2rem;
    color: var(--white);
    text-decoration: none;
    display: flex;
    align-items: center;
    gap: 0.5rem;
  }
  .panel-logo .leaf { color: var(--gold); font-size: 1.4rem; }

  .panel-quote {
    font-family: 'Libre Baskerville', serif;
    font-style: italic;
    font-size: clamp(1.5rem, 2.5vw, 2.2rem);
    font-weight: 400;
    line-height: 1.3;
    color: var(--white);
    margin-bottom: 1rem;
  }
  .panel-quote span { color: var(--gold-light); }
  .panel-caption {
    font-size: 0.78rem;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: rgba(255,255,255,0.55);
  }

  /* ── RIGHT PANEL (form side) ── */
  .panel-right {
    width: 480px;
    flex-shrink: 0;
    background: rgba(12, 28, 20, 0.98);
    border-left: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    justify-content: center;
    padding: 4rem 3.5rem;
    position: relative;
  }

  .panel-right::before {
    content: '';
    position: absolute;
    top: 0; left: 0;
    width: 3px;
    height: 100%;
    background: linear-gradient(to bottom, transparent, var(--gold), transparent);
  }

  .form-eyebrow {
    font-size: 0.65rem;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    color: var(--gold);
    margin-bottom: 0.8rem;
  }
  .form-title {
    font-family: 'Playfair Display', serif;
    font-size: 2.2rem;
    font-weight: 900;
    color: var(--white);
    line-height: 1.1;
    margin-bottom: 0.5rem;
  }
  .form-subtitle {
    font-size: 0.85rem;
    color: rgba(255,255,255,0.5);
    margin-bottom: 2.5rem;
    line-height: 1.5;
  }

  .divider {
    height: 1px;
    background: var(--border);
    margin-bottom: 2.5rem;
  }

  .role-tabs {
    display: flex;
    gap: 0;
    margin-bottom: 2rem;
    border: 1px solid var(--input-border);
    border-radius: 3px;
    overflow: hidden;
  }
  .role-tab {
    flex: 1;
    padding: 0.65rem 1rem;
    text-align: center;
    font-size: 0.75rem;
    font-weight: 600;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: rgba(255,255,255,0.45);
    cursor: pointer;
    background: transparent;
    border: none;
    transition: background 0.2s, color 0.2s;
  }
  .role-tab.active {
    background: var(--gold);
    color: var(--green-deep);
  }
  .role-tab:not(.active):hover {
    background: rgba(255,255,255,0.05);
    color: rgba(255,255,255,0.75);
  }

  .field-group { margin-bottom: 1.3rem; }
  .field-label {
    display: block;
    font-size: 0.72rem;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: rgba(255,255,255,0.55);
    margin-bottom: 0.5rem;
    font-weight: 500;
  }
  .field-input {
    width: 100%;
    background: var(--input-bg);
    border: 1px solid var(--input-border);
    border-radius: 2px;
    padding: 0.85rem 1rem;
    color: var(--white);
    font-family: 'DM Sans', sans-serif;
    font-size: 0.9rem;
    outline: none;
    transition: border-color 0.2s, background 0.2s;
  }
  .field-input::placeholder { color: rgba(255,255,255,0.22); }
  .field-input:focus {
    border-color: var(--gold);
    background: rgba(201,168,76,0.05);
  }

  .btn-signin {
    width: 100%;
    padding: 1rem;
    background: var(--gold);
    color: var(--green-deep);
    font-family: 'DM Sans', sans-serif;
    font-size: 0.82rem;
    font-weight: 700;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    border: none;
    border-radius: 2px;
    cursor: pointer;
    margin-top: 0.5rem;
    transition: background 0.22s, transform 0.15s;
  }
  .btn-signin:hover { background: var(--gold-light); transform: translateY(-1px); }

  .btn-clear {
    width: 100%;
    padding: 0.9rem;
    background: transparent;
    color: rgba(255,255,255,0.45);
    font-family: 'DM Sans', sans-serif;
    font-size: 0.78rem;
    font-weight: 500;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    border: 1px solid var(--input-border);
    border-radius: 2px;
    cursor: pointer;
    margin-top: 0.6rem;
    transition: border-color 0.2s, color 0.2s;
  }
  .btn-clear:hover { border-color: rgba(255,255,255,0.35); color: rgba(255,255,255,0.7); }

  .form-links {
    margin-top: 2rem;
    padding-top: 1.5rem;
    border-top: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    gap: 0.6rem;
    font-size: 0.78rem;
    color: rgba(255,255,255,0.4);
  }
  .form-links a {
    color: var(--gold-light);
    text-decoration: none;
    transition: color 0.2s;
  }
  .form-links a:hover { color: var(--white); }
</style>
</head>
<body>

<!-- LEFT PANEL -->
<div class="panel-left">
  <div class="panel-left-bg"></div>
  <div class="panel-left-overlay"></div>

  <a href="index.html" class="panel-logo">
    <span class="leaf">🌿</span> AgriRoute
  </a>

  <div class="panel-left-content">
    <p class="panel-quote">
      "Connecting Uganda's<br/> <span>fields to its markets</span> — <br/>one shipment at a time."
    </p>
    <p class="panel-caption">Agricultural Booking &amp; Transport System</p>
  </div>
</div>

<!-- RIGHT PANEL -->
<div class="panel-right">
  <div class="form-eyebrow">Secure Access</div>
  <h1 class="form-title">Welcome<br/>Back</h1>
  <p class="form-subtitle">Sign in to manage bookings, vessels, customers and payments.</p>

  <div class="divider"></div>

  <div class="role-tabs">
    <button class="role-tab active" onclick="setRole('customer', this)">Customer</button>
    <button class="role-tab" onclick="setRole('staff', this)">Staff</button>
    <button class="role-tab" onclick="setRole('admin', this)">Admin</button>
  </div>

  <form id="login-form" method="post" action="userlogin.php">
    <input type="hidden" id="role-input" name="role" value="customer"/>

    <div class="field-group">
      <label class="field-label" for="username">Username</label>
      <input class="field-input" type="text" id="username" name="username" placeholder="Enter your username" required/>
    </div>

    <div class="field-group">
      <label class="field-label" for="password">Password</label>
      <input class="field-input" type="password" id="password" name="password" placeholder="Enter your password" required/>
    </div>

    <button type="submit" class="btn-signin">Sign In to AgriRoute</button>
    <button type="reset" class="btn-clear">Clear Fields</button>
  </form>

  <div class="form-links">
    <span>New user? <a href="register.html">Create an account</a></span>
    <span>Forgot password? <a href="#">Reset here</a></span>
    <span>Need help? <a href="#">Contact Support</a></span>
  </div>
</div>

<script>
  function setRole(role, btn) {
    document.querySelectorAll('.role-tab').forEach(t => t.classList.remove('active'));
    btn.classList.add('active');
    document.getElementById('role-input').value = role;
    document.getElementById('login-form').action = "userlogin.php";
  }
</script>
</body>
</html>
